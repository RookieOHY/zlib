version: 2

project_name: zlib

before:
  hooks:
    # Fail instead of rewriting go.mod/go.sum: a tidy that changes files
    # would build from a tree that differs from the tag.
    - go mod tidy -diff

builds:
  - id: zlib
    main: ./cmd/zlib
    binary: zlib
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # {{.Version}} drops the tag's v; zlib reports versions as vX.Y.Z.
      - -s -w -X github.com/heartleo/zlib/internal/zlib.Version=v{{.Version}} -X github.com/heartleo/zlib/internal/zlib.Commit={{.Commit}} -X github.com/heartleo/zlib/internal/zlib.Date={{.Date}}

archives:
  - id: zlib
    ids:
      - zlib
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  draft: true
  replace_existing_draft: true

